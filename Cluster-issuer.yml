apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Email for Let's Encrypt notifications (expiry, problems, etc.)
    email: naxswayam@gmail.com
    # Production ACME server
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      # Secret where the ACME account private key will be stored
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx  # Updated to use the correct field

