apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: dash  # Updated to match Deployment namespace
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: back-deployment  # Updated to match your Deployment name
  minReplicas: 2
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

