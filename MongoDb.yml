apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb-deployment
  namespace: dash2
  labels:
    app: mongodb
spec:
  serviceName: mongosvc
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb-pod
          image: mongo:latest
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dash-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dash-secret
                  key: MONGO_INITDB_ROOT_USERNAME
          volumeMounts:
            - name: mongodb-storage  # ✅ matches the volume name
              mountPath: /data/db
      volumes:  # ✅ moved inside template.spec
        - name: mongodb-storage
          persistentVolumeClaim:
            claimName: pvc




